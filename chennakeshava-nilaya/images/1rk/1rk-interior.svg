<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EF" />
      <stop offset="100%" stop-color="#EFEBE2" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#DEDAD0" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="24" y="24" width="952" height="702" fill="none" stroke="#DEDAD0" stroke-width="1.5" stroke-dasharray="6 6" rx="8" />
  
  <!-- Architectural Camera / Focal Motif -->
  <g transform="translate(500.0, 335.0)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#B89B68" stroke-width="1.5" />
    <path d="M -14 0 L 14 0 M 0 -14 L 0 14" stroke="#B89B68" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-22" y="-16" width="44" height="32" rx="4" fill="none" stroke="#B89B68" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#B89B68" stroke-width="1.2"/>
  </g>

  <!-- Tag Pill -->
  <rect x="425.0" y="385.0" width="150" height="26" rx="13" fill="#292A27" />
  <text x="500.0" y="402.0" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#F7F5EF" letter-spacing="1.5" text-anchor="middle">1 RK INTERIOR</text>

  <!-- Title & Subtitle -->
  <text x="500.0" y="440.0" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="#292A27" text-anchor="middle">1 RK Furnished Room</text>
  <text x="500.0" y="467.0" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#77766F" text-anchor="middle">Beds and Kitchenette Space Placeholder</text>
  <text x="500.0" y="490.0" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#B89B68" text-anchor="middle">Ready for real property photograph</text>
</svg>